<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" width="560" height="200">
  <!-- Background: warm cream -->
  <rect width="560" height="200" fill="#F5EDDB"/>

  <!-- Olive branch motif — left wing -->
  <g stroke="#1A3C2A" stroke-width="1.2" fill="none">
    <!-- Main stem -->
    <path d="M 200 95 C 215 90, 225 88, 240 86"/>
    <!-- Leaves left to right -->
    <ellipse cx="207" cy="91" rx="6" ry="3" fill="#1A3C2A" stroke="none" transform="rotate(-30 207 91)"/>
    <ellipse cx="216" cy="88" rx="5.5" ry="2.8" fill="#1A3C2A" stroke="none" transform="rotate(-20 216 88)"/>
    <ellipse cx="225" cy="87" rx="5.5" ry="2.8" fill="#1A3C2A" stroke="none" transform="rotate(-10 225 87)"/>
    <ellipse cx="234" cy="86.5" rx="5" ry="2.5" fill="#1A3C2A" stroke="none" transform="rotate(5 234 86.5)"/>
  </g>

  <!-- Olive branch motif — right wing (mirrored) -->
  <g stroke="#1A3C2A" stroke-width="1.2" fill="none">
    <path d="M 360 95 C 345 90, 335 88, 320 86"/>
    <ellipse cx="353" cy="91" rx="6" ry="3" fill="#1A3C2A" stroke="none" transform="rotate(30 353 91)"/>
    <ellipse cx="344" cy="88" rx="5.5" ry="2.8" fill="#1A3C2A" stroke="none" transform="rotate(20 344 88)"/>
    <ellipse cx="335" cy="87" rx="5.5" ry="2.8" fill="#1A3C2A" stroke="none" transform="rotate(10 335 87)"/>
    <ellipse cx="326" cy="86.5" rx="5" ry="2.5" fill="#1A3C2A" stroke="none" transform="rotate(-5 326 86.5)"/>
  </g>

  <!-- Small olives on branches -->
  <circle cx="207" cy="89" r="2" fill="#C9A84C"/>
  <circle cx="225" cy="85" r="2" fill="#C9A84C"/>
  <circle cx="335" cy="85" r="2" fill="#C9A84C"/>
  <circle cx="353" cy="89" r="2" fill="#C9A84C"/>

  <!-- Thin horizontal rule above wordmark -->
  <line x1="185" y1="99" x2="375" y2="99" stroke="#1A3C2A" stroke-width="0.5"/>

  <!-- APHRODITE — primary wordmark in serif, deep forest green -->
  <!-- Using Georgia as proxy for Cormorant Garamond / IM Fell English -->
  <text
    x="280"
    y="133"
    font-family="'Cormorant Garamond', 'IM Fell English', Georgia, 'Times New Roman', serif"
    font-size="44"
    font-weight="300"
    font-style="normal"
    letter-spacing="5"
    fill="#1A3C2A"
    text-anchor="middle"
    dominant-baseline="auto"
  >APHRODITE</text>

  <!-- Thin horizontal rule below APHRODITE -->
  <line x1="185" y1="141" x2="375" y2="141" stroke="#1A3C2A" stroke-width="0.5"/>

  <!-- TREATS — smaller, spaced small caps, terracotta -->
  <text
    x="280"
    y="160"
    font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif"
    font-size="14"
    font-weight="400"
    letter-spacing="8"
    fill="#C4622D"
    text-anchor="middle"
    dominant-baseline="auto"
  >TREATS</text>

  <!-- Descriptor line -->
  <text
    x="280"
    y="178"
    font-family="'Lato', 'Helvetica Neue', Arial, sans-serif"
    font-size="8.5"
    font-weight="300"
    letter-spacing="3.5"
    fill="#1A3C2A"
    text-anchor="middle"
    dominant-baseline="auto"
    opacity="0.7"
  >ARTISAN DELI · LONDON</text>
</svg>
